name: Windows public package
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      input_base_url:
        description: HTTPS directory containing the authoringInput files in public-input-lock.v1.json
        required: true
        type: string
      test_web:
        description: Also build and test the independent HTTP consumer against the full stress-annotated package
        required: true
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.403
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Client JavaScript syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check apps/BgLang.Web/wwwroot/live-client.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check apps/BgLang.Web/wwwroot/live-demo.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check apps/BgLang.Web/wwwroot/demo-lab/demo.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Client transport and DOM checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:BGLANG_CLIENT_SOURCE_ROOT = $env:GITHUB_WORKSPACE
          node --test tests/BgLang.Web.Tests/Client/live-demo.test.mjs tests/BgLang.Web.Tests/Client/demo-lab.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Locked authoring input, Graph5 package, Public/example and optional HTTP checks
        shell: pwsh
        env:
          INPUT_BASE_URL: ${{ inputs.input_base_url || vars.BGLANG_INPUT_BASE_URL }}
          TEST_WEB: ${{ github.event_name != 'workflow_dispatch' || inputs.test_web }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:DOTNET_CLI_HOME = Join-Path $env:RUNNER_TEMP 'dotnet-home'
          $env:NUGET_PACKAGES = Join-Path $env:RUNNER_TEMP 'nuget-packages'
          $env:NUGET_HTTP_CACHE_PATH = Join-Path $env:RUNNER_TEMP 'nuget-http-cache'
          $env:NUGET_PLUGINS_CACHE_PATH = Join-Path $env:RUNNER_TEMP 'nuget-plugins-cache'
          if ([string]::IsNullOrWhiteSpace($env:INPUT_BASE_URL)) { throw 'Set input_base_url or BGLANG_INPUT_BASE_URL to the matching locked authoring assets.' }
          $base = [Uri]$env:INPUT_BASE_URL
          if (!$base.IsAbsoluteUri -or $base.Scheme -ne 'https') { throw 'HTTPS input directory required.' }
          $lock = Get-Content data/dictionary/public-input-lock.v1.json -Raw | ConvertFrom-Json
          if (!$lock.authoringInput -or !$lock.authoringInput.files) { throw 'The successor authoringInput lock is required.' }
          $authoringDirectory = Join-Path $env:RUNNER_TEMP 'authoring-input'
          New-Item -ItemType Directory -Path $authoringDirectory | Out-Null
          foreach ($file in $lock.authoringInput.files) {
            $download = Join-Path $authoringDirectory $file.name
            Invoke-WebRequest -Uri ($base.AbsoluteUri.TrimEnd('/') + '/' + $file.name) -OutFile $download
            if ((Get-Item -LiteralPath $download).Length -ne $file.bytes -or (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256) { throw "Locked authoring input mismatch: $($file.name)" }
          }
          $articleCurrent = Join-Path $env:RUNNER_TEMP 'article-current'
          ./packaging/Build-PublicPackage.ps1 -InputDirectory $authoringDirectory -Profile Current -OutputDirectory $articleCurrent
          $packageA = Join-Path $env:RUNNER_TEMP 'annotated-a'
          $packageB = Join-Path $env:RUNNER_TEMP 'annotated-b'
          $optionalChecks = @{}
          if ($env:TEST_WEB -eq 'true') { $optionalChecks.TestWeb = $true }
          else { Write-Host 'HTTP consumer checks were not requested; no HTTP validation is claimed for this run.' }
          ./packaging/Build-PublicPackage.ps1 -InputDirectory $authoringDirectory -Profile CurrentGraphStress -ArticleCurrentManifest (Join-Path $articleCurrent 'manifest.json') -OutputDirectory $packageA -Test -ResultsDirectory (Join-Path $env:RUNNER_TEMP 'results-a') @optionalChecks
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            ./packaging/Build-PublicPackage.ps1 -InputDirectory $authoringDirectory -Profile CurrentGraphStress -ArticleCurrentManifest (Join-Path $articleCurrent 'manifest.json') -OutputDirectory $packageB -Test -ResultsDirectory (Join-Path $env:RUNNER_TEMP 'results-b') -CompareWith $packageA @optionalChecks
          }
